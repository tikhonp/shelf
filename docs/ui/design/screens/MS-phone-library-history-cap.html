body{margin:0}
.rs .ah-prow{grid-template-columns:minmax(0,1fr) auto;width:100%;margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:inherit;font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.rs .ah-prow .lib-q{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rs .row .sub .by{color:var(--text);font-weight:600}
.rs .ah-pline{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 8px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px}
.rs .ah-pline .mono{grid-column:1 / -1;font-size:12.5px;overflow-wrap:anywhere}
.rs .ah-pline span{overflow-wrap:anywhere}
.rs .ah-note{padding:8px 14px;border-bottom:1px solid var(--line)}

</style>

<div class="tb">

</div>
