<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Shelf · Phone · Library with the Inbox cap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../library.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="rs ph desk " style="position: relative; width: 390px; height: 844px; overflow: hidden">
<div class="stack">
<section class="win" aria-labelledby="lph-h">
<div class="tb"><h1 id="lph-h">Library</h1><span class="stripes"></span><a class="wbtn txt" href="#">Inbox<span class="led" title="Proposals wait for review" style="--c: var(--sun)"></span></a></div>
<div style="padding: 10px 12px; border-bottom: 1px solid var(--ink)">
<label class="field"><span class="sr">Search the library</span><input type="search" placeholder="Search" readonly="readonly"></label>
</div>
<div class="vscroll" style="gap: 0">
<ul style="list-style: none; margin: 0; padding: 0" aria-label="Albums">
<li style="display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 68px; padding: 6px 12px; border-bottom: 1px solid var(--line)"><span class="cv a-signal" style="width: 46px; height: 46px"></span><span style="min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">Computerwelt</span><span class="sub">Kraftwerk · 1981</span><span><span class="stk">CD 16/44.1</span></span></span><span class="led iss" role="img" aria-label="Has issues"></span></li>
<li style="display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 68px; padding: 6px 12px; border-bottom: 1px solid var(--line)"><span class="cv a-night" style="width: 46px; height: 46px"></span><span style="min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">Dummy</span><span class="sub">Portishead · 1994</span><span><span class="stk">CD 16/44.1</span></span></span><span class="led iss" role="img" aria-label="Has issues"></span></li>
<li style="display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 68px; padding: 6px 12px; border-bottom: 1px solid var(--line)"><span class="cv a-tide" style="width: 46px; height: 46px"></span><span style="min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">Spirit of Eden</span><span class="sub">Talk Talk · 2012</span><span><span class="stk">CD 16/44.1</span></span></span><span class="led iss" role="img" aria-label="Has issues"></span></li>
</ul>
</div>
</section>
</div>
<nav class="dock" aria-label="Main">
<a class="on" href="#" aria-current="page"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M9 4v16M13.5 4.5l5 15"></path></svg>Library<span class="led" title="Proposals wait for review"></span></a>
<a href="#"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.5-4.5"></path></svg>Search</a>
<a href="#"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="9" cy="12" r="2"></circle><circle cx="15" cy="12" r="2"></circle><path d="M7 18l1.5-3h7L17 18"></path></svg>Downloads</a>
<a href="#"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path></svg>Status</a>
</nav>
</div>
<script>if (new URLSearchParams(location.search).get("theme") === "day") document.querySelectorAll(".rs").forEach((e) => e.classList.add("day"));</script>
</body>
</html>
