<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Shelf · Phone · account sign-in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../library.css">
<link rel="stylesheet" href="../slide.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="rs ph desk " style="position: relative; width: 390px; height: 844px; overflow: hidden">
<div class="stack" style="bottom: 10px; justify-content: center">
<section class="win" aria-labelledby="sp-h" style="flex: 0 1 auto">
<h1 id="sp-h" class="sr">Sign in to Music Shelf</h1>
<div class="vscroll" style="gap: 14px; padding: 16px 14px">
<div class="lcd" role="status" style="flex: none; min-height: 80px"><div class="lcd-l dim">MUSIC SHELF</div><div class="lcd-l">SIGNED OUT</div><div class="lcd-l">PASSWORD OR PASSKEY</div></div>
<form style="display: flex; flex-direction: column; gap: 14px">
<label class="lbl-f">Username<input class="input" name="username" autocomplete="username webauthn" autocapitalize="none" spellcheck="false" value="tikhon" readonly="readonly"></label>
<label class="lbl-f">Password<input class="input" name="password" type="password" autocomplete="current-password" value="" readonly="readonly"></label>
<button type="button" class="key sun lg block">Sign in</button>
</form>
<div style="border-top: 1px solid var(--line)">
<button type="button" class="slide row" role="switch" aria-checked="false" aria-label="Sign in with a passkey" data-demo>
<span class="sl-name">Passkey</span>
<span class="sl-row"><span class="sl-t off">OFF</span><span class="sl-track"><span class="sl-cap"></span></span><span class="sl-t on">ON</span></span>
</button>
</div>
</div>
</section>
</div>
</div>
<script>if (new URLSearchParams(location.search).get("theme") === "day") document.querySelectorAll(".rs").forEach((e) => e.classList.add("day"));</script>
<script src="../slide-demo.js"></script>
</body>
</html>
