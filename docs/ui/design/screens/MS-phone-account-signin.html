<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Shelf · Phone · account sign-in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../library.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="rs ph desk " style="position: relative; width: 390px; height: 844px; overflow: hidden">
<div class="stack">
<div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 6px">
<span class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>Music Shelf</span>
<span style="display: flex; align-items: center; gap: 8px"><span class="led off" title="Qobuz"></span><span class="led off" title="Apple Music"></span><span class="led off" title="Navidrome"></span><span class="vfd num" aria-label="Clock">--:--</span></span>
</div>
<section class="win" aria-labelledby="sp-h">
<div class="tb"><h1 id="sp-h">Sign in</h1><span class="stripes"></span></div>
<div class="vscroll" style="gap: 14px; padding: 16px 14px">
<div class="lcd" role="status" style="flex: none; min-height: 60px"><div class="lcd-l">SIGNED OUT</div><div class="lcd-l">PASSWORD OR PASSKEY</div></div>
<form style="display: flex; flex-direction: column; gap: 14px">
<label class="lbl-f">Username<input class="input" name="username" autocomplete="username webauthn" autocapitalize="none" spellcheck="false" value="tikhon" readonly="readonly"></label>
<label class="lbl-f">Password<input class="input" name="password" type="password" autocomplete="current-password" value="" readonly="readonly"></label>
<button type="button" class="key sun lg block">Sign in</button>
</form>
<div style="display: flex; align-items: center; gap: 14px; padding-top: 6px; border-top: 1px solid var(--line)">
<svg width="96" height="84" viewBox="0 0 150 124" aria-hidden="true" style="flex: none; color: var(--text-2)">
<defs>
<radialGradient id="ksp-chrome" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#F4F6F8"></stop><stop offset=".5" stop-color="#A3AAB4"></stop><stop offset="1" stop-color="#3F454E"></stop></radialGradient>
<linearGradient id="ksp-key" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F3EA"></stop><stop offset="1" stop-color="#BDB29A"></stop></linearGradient>
</defs>
<text x="20" y="22" fill="currentColor" style="font: 700 14px var(--label); letter-spacing: .1em">OFF</text>
<text x="112" y="22" fill="currentColor" style="font: 700 14px var(--label); letter-spacing: .1em">ON</text>
<circle cx="75" cy="72" r="44" fill="url(#ksp-chrome)" stroke="#0A0C10" stroke-width="1.5"></circle>
<circle cx="75" cy="72" r="32" fill="#1B1F26" stroke="#0A0C10"></circle>
<g transform="rotate(-40 75 72)">
<rect x="71" y="44" width="8" height="56" rx="2" fill="#07090C"></rect>
<ellipse cx="75" cy="72" rx="13" ry="27" fill="url(#ksp-key)" stroke="#0A0C10" stroke-width="1.5"></ellipse>
<circle cx="75" cy="55" r="4" fill="#1B1F26"></circle>
</g>
</svg>
<button type="button" class="key block" style="flex: 1">Sign in with a passkey</button>
</div>
</div>
</section>
</div>
<nav class="dock" aria-hidden="true" style="opacity: .35">
<a><svg class="i l" viewBox="0 0 24 24"><path d="M5 4v16M9 4v16M13.5 4.5l5 15"></path></svg>Library</a>
<a><svg class="i l" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.5-4.5"></path></svg>Search</a>
<a><svg class="i l" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="9" cy="12" r="2"></circle><circle cx="15" cy="12" r="2"></circle><path d="M7 18l1.5-3h7L17 18"></path></svg>Downloads</a>
<a><svg class="i l" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path></svg>Status</a>
</nav>
</div>
<script>if (new URLSearchParams(location.search).get("theme") === "day") document.querySelectorAll(".rs").forEach((e) => e.classList.add("day"));</script>
</body>
</html>
