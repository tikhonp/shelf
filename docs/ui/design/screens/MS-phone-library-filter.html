<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Shelf · Phone · filter menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../library.css">
<style>body { margin: 0; }</style>
</head>
<body>
<div style="width: 390px; height: 844px">


<div class="rs ph desk" style="position: relative; width: 390px; height: 844px; overflow: hidden">
<div class="stack">


<section class="win" aria-labelledby="lp-t">
<div class="tb">
<h1 id="lp-t">Library</h1>
<span class="stripes"></span>
<button type="button" class="wbtn txt srcbtn" aria-expanded="true" aria-haspopup="menu" aria-label="Filter: All albums"><span class="ell" style="max-width: 190px">All albums</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="padding: 12px 12px 0">
<label class="field">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.5-4.5"></path></svg>
<span class="sr">Search the library</span>
<input type="search" value="" placeholder="Album or artist">
</label>
</div>
<div class="rotary" role="radiogroup" aria-label="Sort by" style="margin-top: 12px">
<div class="rot-labels">
<button type="button" role="radio" aria-checked="true"><span class="led"></span>Album</button>
<button type="button" role="radio" aria-checked="false"><span class="led"></span>Artist</button>
<button type="button" class="knob grey" style="--s: 48px; --a: -75deg" aria-label="Change the sort, now Album" title="Press to turn"><i></i></button>
<button type="button" role="radio" aria-checked="false"><span class="led"></span>Year</button>
<button type="button" role="radio" aria-checked="false"><span class="led"></span>Added</button>
</div>
</div>
<div class="rows" role="list" aria-label="Albums" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none">

<div class="row lib-prow" role="listitem">
<span class="cv a-radio" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Coastal Radio</span><span class="ver"></span></span>
<span class="sub ell">Northern Static · 2014 · 8 tracks</span>
<span style="margin-top: 4px"><span class="stk lossy">MP3 320</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-orchard" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Glass Orchard</span><span class="ver">Deluxe Edition</span></span>
<span class="sub ell">Vela Choir · 2025 · 12 tracks</span>
<span style="margin-top: 4px"><span class="stk ">Lossless</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-harbour" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Harbour Lights</span><span class="ver"></span></span>
<span class="sub ell">Northern Static · 2016 · 9 tracks</span>
<span style="margin-top: 4px"><span class="stk ">CD 16/44.1</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-halden" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Live at Halden</span><span class="ver"></span></span>
<span class="sub ell">Northern Static · 2023 · 14 tracks</span>
<span style="margin-top: 4px"><span class="stk hi">Hi-Res 24/96</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-tide" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Low Tide Hymns</span><span class="ver"></span></span>
<span class="sub ell">Northern Static · 2019 · 11 tracks</span>
<span style="margin-top: 4px"><span class="stk hi">Hi-Res 24/96</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-tide2" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Low Tide Hymns</span><span class="ver">2024 Remaster</span></span>
<span class="sub ell">Northern Static · 2024 · 11 tracks</span>
<span style="margin-top: 4px"><span class="stk master">Hi-Res 24/192</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-ferry" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Night Ferry</span><span class="ver"></span></span>
<span class="sub ell">Mira Holt · 2020 · 9 tracks</span>
<span style="margin-top: 4px"><span class="stk hi">Hi-Res 24/96</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-lantern" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Paper Lanterns</span><span class="ver"></span></span>
<span class="sub ell">The Quiet Arcade · 2023 · 12 tracks</span>
<span style="margin-top: 4px"><span class="stk ">CD 16/44.1</span></span>
</button>

</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-rooms" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Quiet Rooms</span><span class="ver"></span></span>
<span class="sub ell">Mira Holt · 2022 · 10 tracks</span>
<span style="margin-top: 4px"><span class="stk ">Lossless</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-signal" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Signal Fires</span><span class="ver"></span></span>
<span class="sub ell">Northern Static · 2017 · 5 tracks</span>
<span style="margin-top: 4px"><span class="stk hi">Hi-Res 24/96</span></span>
</button>

</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-hours" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Small Hours, Vol. 2</span><span class="ver"></span></span>
<span class="sub ell">Various Artists · 2018 · 16 tracks</span>
<span style="margin-top: 4px"><span class="stk hi">Hi-Res 24/96</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>

<div class="row lib-prow" role="listitem">
<span class="cv a-weather" style="width: 62px; height: 62px"></span>
<button type="button" class="lib-open two" style="gap: 3px">
<span class="ttl"><span class="ell">Static Weather</span><span class="ver"></span></span>
<span class="sub ell">Northern Static · 2021 · 10 tracks</span>
<span style="margin-top: 4px"><span class="stk hi">Hi-Res 24/96</span></span>
</button>
<span class="led iss" role="img" aria-label="Has issues"></span>
</div>


</div>

<div class="pop" role="menu" aria-label="Filter" style="left: 8px; right: 8px; top: 60px; bottom: 8px; overflow-y: auto">

<div class="pop-h">Show</div>

<button type="button" role="menuitemradio" aria-checked="true" class="hl">
<span class="ck"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"></path></svg></span>
<span class="ell">All albums</span>
<span class="hint num">1,099</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Has issues</span>
<span class="hint num">1,091</span>
</button>


<div class="pop-h">Issues</div>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Missing required tag</span>
<span class="hint num">4</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Split album</span>
<span class="hint num">2</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Values differ across tracks</span>
<span class="hint num">37</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Tags disagree</span>
<span class="hint num">14</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Navidrome shows a reissue year</span>
<span class="hint num">23</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">No RELEASEDATE</span>
<span class="hint num">1,088</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Various Artists, not a compilation</span>
<span class="hint num">9</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Wrong artist split</span>
<span class="hint num">6</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">IDs from two releases</span>
<span class="hint num">3</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">No cover</span>
<span class="hint num">5</span>
</button>


<div class="pop-h">Also</div>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">No MusicBrainz ID</span>
<span class="hint num">132</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">Guide style</span>
<span class="hint num">640</span>
</button>


<div class="pop-h">Folders</div>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">qobuz</span>
<span class="hint num">412</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">apple-music</span>
<span class="hint num">96</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">jazz</span>
<span class="hint num">140</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">rock</span>
<span class="hint num">233</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">classical</span>
<span class="hint num">98</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">electronic</span>
<span class="hint num">81</span>
</button>

<button type="button" role="menuitemradio" aria-checked="false" class="">
<span class="ck"></span>
<span class="ell">soundtracks</span>
<span class="hint num">39</span>
</button>


</div>

</section>
