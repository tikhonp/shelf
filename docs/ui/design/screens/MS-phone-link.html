<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Shelf · Phone · pasted link</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body { margin: 0; }</style>
</head>
<body>
<div class="rs ph desk" style="position: relative; width: 390px; height: 844px; overflow: hidden">
<section class="win" style="position: absolute; left: 8px; right: 12px; top: 10px; bottom: 96px" aria-labelledby="pl-t">
<div class="tb">
<h1 id="pl-t">Search</h1>
<span class="stripes"></span>
</div>
<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 0">
<label class="field">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
<span class="sr">Search, or paste a Qobuz or Apple Music link</span>
<input type="search" value="https://music.apple.com/ru/album/paper-lanterns/1712345678">
<button type="button" class="key flat icon" aria-label="Clear"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</label>
<p class="sub" style="display: flex; align-items: center; gap: 8px">The link points to an album on <span class="src am">Apple Music</span></p>

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 8px; text-align: center">
<div style="position: relative">
<span class="cv a-lantern" style="display: block; width: 188px; height: 188px; border-width: 2px; border-radius: 6px; box-shadow: 5px 5px 0 var(--ink)"></span>
<span class="stk" style="position: absolute; left: -14px; top: 14px; transform: rotate(-8deg); height: 26px; font-size: 12px">Lossless</span>
<span class="stk atmos" style="position: absolute; right: -16px; bottom: 18px; transform: rotate(5deg); height: 26px; font-size: 12px">Dolby Atmos</span>
</div>
<div class="two" style="align-items: center; gap: 3px">
<h2 style="font-size: 23px; font-weight: 700; line-height: 1.2">Paper Lanterns</h2>
<a href="MS-phone-search.html" style="font-size: 16px; font-weight: 600; padding: 2px 0">The Quiet Arcade</a>
<span class="sub num">2023 · 12 tracks · 46:20 · Arcade Sound</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div class="split block">
<button type="button" class="key sun lg"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg>Download album</button>
<button type="button" class="key sun lg icon" aria-label="Choose format" aria-haspopup="menu"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<p class="t3 sm" style="text-align: center">Format: ALAC</p>
<a class="key block" href="MS-phone-album.html">Show the tracks</a>
</div>
</div>
</section>

<nav class="dock" aria-label="Main">
<a href="MS-phone-start.html" class="on" aria-current="page"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.5-4.5"></path></svg>Search</a>
<a href="MS-phone-downloads.html"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="9" cy="12" r="2"></circle><circle cx="15" cy="12" r="2"></circle><path d="M7 18l1.5-3h7L17 18"></path></svg>Downloads<span class="led run" title="Downloads in progress"></span><span class="sr">, downloads in progress</span></a>
<a href="MS-phone-status.html"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path></svg>Status</a>
</nav>
</div>
<!-- Add ?theme=day to the address to see the Day theme. -->
<script>if (new URLSearchParams(location.search).get("theme") === "day") document.querySelectorAll(".rs").forEach((e) => e.classList.add("day"));</script>
</body>
</html>
