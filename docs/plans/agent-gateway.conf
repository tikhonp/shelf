# Draft only. Merge into the existing Shelf server in sh-main.
# Keep the existing upstream address and proxy headers from that server.
# Apply only after the Shelf API path guard and scoped token checks ship.
location ^~ /api/agent/ {
    auth_basic off;
    # nginx matches locations after URI normalization. Check the original
    # path too so traversal cannot enter this exemption from another prefix.
    if ($request_uri !~ "^/api/agent/v1(/[A-Za-z0-9_.-]+)*/?(\?.*)?$") { return 404; }
    proxy_pass http://ssh-server:10013;
    proxy_buffering off;
    client_max_body_size 33m;
}
# Verify credential-free traversal requests fail before deploying:
# /api/library/x/../../agent/v1/runs
# /api/agent/v1/../../library/albums/1/save
# /api/agent/v1/%2e%2e/%2e%2e/library/albums/1/save
