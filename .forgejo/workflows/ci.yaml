name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner keeps the tool, module and build caches on volumes, so Go
      # and the modules are downloaded once. The timeouts fail a stalled
      # download instead of holding the job for an hour.
      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        timeout-minutes: 10
        run: go mod download

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "::error::unformatted files:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test GOTESTFLAGS=-timeout=30m

  # Lint and govulncheck run on a runner of their own and don't wait for the
  # tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        timeout-minutes: 10
        run: go mod download

      # The Dockerfile's lint stage uses the same version. A newer one would
      # bring new findings unasked.
      - name: golangci-lint
        timeout-minutes: 20
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      # Fails on every vulnerability shelf's code reaches.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same Node as the Dockerfile's web stage.
      - uses: actions/setup-node@v7
        timeout-minutes: 10
        with:
          node-version: 24

      - name: vue-tsc, Vitest and the build
        timeout-minutes: 15
        run: make web-check

  # The image job builds only a commit whose checks passed. A push to main
  # tags :<sha>, :main and :latest, and blackberry follows :latest. The
  # automatic token can't write packages, so REGISTRY_TOKEN is an access
  # token with write:package.
  image:
    needs: [test, lint, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    env:
      REGISTRY: code.tikhonnnnn.com
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve image tags
        id: version
        run: |
          IMAGE="${REGISTRY}/${{ github.repository }}"
          echo "tags=${IMAGE}:${{ github.sha }},${IMAGE}:${{ github.ref_name }},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.ref_name }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.version.outputs.tags }}
