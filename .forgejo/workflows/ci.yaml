name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner keeps the tool, module and build caches on volumes, so Go
      # and the modules are downloaded once. The timeouts fail a stalled
      # download instead of holding the job for an hour.
      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        timeout-minutes: 10
        run: go mod download

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "::error::unformatted files:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test GOTESTFLAGS=-timeout=30m

  # Lint and govulncheck run on a runner of their own and don't wait for the
  # tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        timeout-minutes: 10
        run: go mod download

      # The Dockerfile's lint stage uses the same version. A newer one would
      # bring new findings unasked.
      - name: golangci-lint
        timeout-minutes: 20
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      # Fails on every vulnerability shelf's code reaches.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same Node as the Dockerfile's web stage.
      - uses: actions/setup-node@v7
        timeout-minutes: 10
        with:
          node-version: 26

      - name: vue-tsc, Vitest and the build
        timeout-minutes: 15
        run: make web-check

  # The image job builds only a commit whose checks passed. A push to main
  # tags :<sha>, :main and :latest, and blackberry follows :latest. A v* tag
  # publishes only :<tag>, so a release never moves :latest. The automatic
  # token can't write packages, so REGISTRY_TOKEN is an access token with
  # write:package.
  image:
    needs: [test, lint, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    env:
      REGISTRY: code.tikhonnnnn.com
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve image tags
        id: version
        run: |
          IMAGE="${REGISTRY}/${{ github.repository }}"
          WRAPPER="${IMAGE}-wrapper"
          REF="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=${IMAGE}:${REF}" >> "$GITHUB_OUTPUT"
            echo "wrapper_tags=${WRAPPER}:${REF}" >> "$GITHUB_OUTPUT"
            echo "version=${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${GITHUB_SHA},${IMAGE}:${REF},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "wrapper_tags=${WRAPPER}:${GITHUB_SHA},${WRAPPER}:${REF},${WRAPPER}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${REF}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # A tag push may carry no head_commit, so the date comes from git.
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.version.outputs.tags }}

      # shelf-wrapper: wrapper-lite and the supervisor. wrapper-lite is amd64
      # only.
      - name: Build and push shelf-wrapper
        uses: docker/build-push-action@v7
        with:
          context: .
          target: wrapper
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.version.outputs.wrapper_tags }}
